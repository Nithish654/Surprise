<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Nanduukuttyyy ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #fff1f2;
    }

    .font-cursive {
      font-family: 'Great Vibes', cursive;
    }

    .font-romantic {
      font-family: 'Dancing Script', cursive;
    }

    .font-sans {
      font-family: 'Montserrat', sans-serif;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: float linear infinite;
    }
  </style>
